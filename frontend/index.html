<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hear2Heal - AI Emergency Medical Language & Clinical Triage Suite</title>
  <meta name="description" content="Zero-Click AI Medical Language Auto-Detection, Emergency Clinical Triage & Offline Speech Translation Suite for Healthcare Professionals.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app-container">
    <!-- Collapsible Sidebar Dashboard -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-title">
          <span>🩺</span>
          <span class="sidebar-header-title">Hear2Heal</span>
        </div>
        <button class="btn-toggle" id="toggleSidebarBtn" title="Toggle Sidebar">◨</button>
      </div>

      <div class="nav-menu" id="navMenu">
        <!-- Generated Dynamically by JS -->
      </div>

      <div style="padding: 1rem; border-top: 1px solid var(--border-subtle);">
        <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted);">
          <span>Staff Active:</span>
          <span style="color: #34D399; font-weight: 700;">🟢 Online</span>
        </div>
        <div id="activeUserLabel" style="font-size: 0.85rem; font-weight: 600; color: var(--text-primary); margin-top: 0.25rem;">
          Dr. A. Sharma (ER)
        </div>
        <button class="btn-primary" id="logoutBtn" style="width: 100%; margin-top: 0.75rem; padding: 0.5rem; font-size: 0.8rem; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #F87171;">
          🚪 Log Out
        </button>
      </div>
    </aside>

    <!-- Main Workspace Container -->
    <main class="main-content">
      <!-- Top Navigation & Quick Suite Header -->
      <header class="top-bar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <h2 id="screenTitleHeader" style="font-family: var(--font-display); font-size: 1.15rem; font-weight: 700;">
            Clinical Triage Overview
          </h2>
        </div>

        <div style="display: flex; align-items: center; gap: 1rem;">
          <!-- Viewport Mode Toggle -->
          <div class="view-toggle">
            <button class="btn-toggle active" id="btnDeviceView">📱 Mobile View</button>
            <button class="btn-toggle" id="btnGalleryView">📊 3x3 All Screens</button>
          </div>

          <!-- Active Triage Level Badge -->
          <div id="headerTriageBadge" class="triage-pill-badge triage-red-badge">
            <span>🔴 TRIAGE: RED (CRITICAL)</span>
          </div>

          <!-- Quick SOS Trigger Button -->
          <button class="btn-danger pulse-sos-btn" id="headerSosBtn" style="padding: 0.4rem 0.85rem; font-size: 0.8rem;">
            🚨 SOS CRASH
          </button>
        </div>
      </header>

      <!-- Viewport Display Container -->
      <div class="viewport-container" id="viewportContainer">
        <!-- Interactive Screen Viewport Mounted Here by App.js -->
      </div>
    </main>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/data.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
